# Each published release (prereleases too) posted to the Discord server's #release-notes,
# through a channel webhook kept in the repository secret DISCORD_RELEASE_WEBHOOK.
# Run it by hand (workflow_dispatch) to post the latest release again.
name: Discord release notes
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post the release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_RELEASE_WEBHOOK secret: nothing posted."; exit 0; fi
          # A pasted secret may carry spaces, a line break or quotes.
          WEBHOOK=$(printf '%s' "$WEBHOOK" | tr -d "[:space:]\"'")
          case "$WEBHOOK" in https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;; *) echo "DISCORD_RELEASE_WEBHOOK is not a Discord webhook address (it should start with https://discord.com/api/webhooks/)."; exit 1;; esac
          if [ -n "$TAG" ]; then release=$(gh api "repos/$REPO/releases/tags/$TAG"); else release=$(gh api "repos/$REPO/releases?per_page=1" --jq '.[0]'); fi
          echo "$release" | jq '{
            username: "Maelstrom VTT",
            avatar_url: "https://raw.githubusercontent.com/\(env.REPO)/main/build/icon.png",
            embeds: [{
              title: ("Maelstrom VTT " + (.name // .tag_name)),
              url: .html_url,
              description: (((.body // "") | if length > 3800 then .[0:3800] + "…" else . end) + "\n\n**Install:** restart Maelstrom and use the update on the start screen, or download it from the release page."),
              color: 3381196
            }]
          }' > payload.json
          curl -sS --fail-with-body -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
